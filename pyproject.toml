[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywarper"
version = "0.2.8"
description = "Conformal mapping-based warping of retinal morphologies."
authors = []
requires-python = ">=3.10.0"
dependencies = [
    "alphashape>=1.3.1",
    "hea>=0.1.9",
    "numpy>=2.2.0",
    "pygridfit>=0.2.0",
    "scipy>=1.15.0",
    "skeliner>=0.3.0",
    "trimesh>=4.0",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "watermark>=2.5.0",
]

[tool.uv.sources]
pygridfit = { git = "https://github.com/berenslab/pygridfit.git", branch = "main" }

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ARG"]
